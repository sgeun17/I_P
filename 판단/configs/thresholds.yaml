# Human Review 전환 임계값
#
# v0.3 — 골든셋 29건 측정 결과를 반영했다.
# 여전히 임시값이다. 골든셋 평가 뒤에 확정한다.
# 값을 바꾸면 profile_name도 올린다. 코드는 건드리지 않는다.

profile_name: thresholds_v0.3

review:
  # 매핑된 통제항목의 llm_confidence가 이 값보다 낮으면 검토
  low_confidence: 0.70

  # 1위와 2위 후보의 similarity_score 차이가 이보다 작으면 검토
  #
  # BGE-M3 실측: 1위 0.5833 / 2위 0.5280 → 차이 0.0553
  #
  # 골든셋 29건에서 0.03은 17건 발동 / 단독 결정 1건이었다.
  # 검토 결정에는 영향이 없고 사유 목록만 늘어나므로 0.01로 낮춘다.
  # 검색팀이 실제 Retriever 점수를 뽑아주면 다시 잰다.
  narrow_score_gap: 0.01

  # 검색 점수가 이 이상인데 전부 NOT_RELATED면 검색과 판단이 충돌한 것으로 본다
  #
  # BGE-M3는 관련 있어도 0.5~0.6에 몰린다. v0.1의 0.85는 영영 발동하지 않았다.
  high_similarity: 0.55

  # 인용된 청크가 이 글자 수보다 짧으면 검토
  min_chunk_length: 30

  # 결과 유형 자체를 검토로 보낼지
  #
  # 2026-09-24 판단팀 결정: **켜고 시작한다.**
  #   근거 — 골든셋 29건에서 켜면 24건(83%), 끄면 14건(48%)이 검토 대상이다.
  #          초기에는 LLM이 NO_MATCH와 1:N을 제대로 내는지 알 수 없으므로
  #          사람이 보면서 오답 패턴을 파악하는 편이 낫다.
  #
  # 끄는 시점 — 골든셋 평가에서 아래를 확인한 뒤
  #   1) NO_MATCH 정확도가 안정되면 review_on_no_match부터 끈다
  #      (골든셋에서 NO_MATCH가 9건 중 5건의 단독 결정자다)
  #   2) 그다음 1:N을 본다
  review_on_no_match: true
  review_on_multi_mapping: true

  # OCR 청크 인용 시 검토 (R207)
  # 전처리팀이 OCR 품질 점수를 주지 않으므로 source == "ocr" 자체가 신호다.
  # 임계값이 없는 조건이라 코드에 고정되어 있다.

rules:
  # 1:N 매핑 상한. 골든셋 정답이 4개 이상인 사례가 나오면 올린다
  max_mapped_controls: 3

  # MATCHED일 때 PRIMARY 개수
  primary_count_when_matched: 1

retry:
  max_retries: 1
  timeout_seconds: 60
  backoff_seconds: 2.0
